<div class="min-h-dvh overflow-x-hidden bg-[#10296d] px-3 py-6 font-body text-white sm:px-5">
  <div class="flex min-h-dvh flex-col items-center justify-center gap-4">

    <!-- TARJETA PRINCIPAL -->
    <main class="w-[92%] max-w-[500px] rounded-[22px] border border-blue-100/50 bg-white px-5 py-7 text-gray-800 shadow-[0_18px_42px_rgba(13,35,120,0.14)] sm:px-8 sm:py-8">

      <!-- ENCABEZADO -->
      <section class="mb-6 flex flex-col items-center gap-2 text-center">
        <div class="flex h-16 w-16 items-center justify-center rounded-[14px] bg-[#1f3fbf] shadow-md">
          <img src="/favicon.png" alt="BarberApp Logo" class="h-9 w-9 object-contain" />
        </div>
        <h1 class="font-display text-xl font-bold text-[#07205f] sm:text-2xl">
          Nueva Contraseña
        </h1>
        <p class="text-xs text-gray-500 sm:text-sm">
          Ingresa tu nueva contraseña para la cuenta <br />
          <strong class="text-gray-700">{{ email() }}</strong>
        </p>
      </section>

      <!-- MENSAJE DE ÉXITO -->
      @if (mensajeExito()) {
        <div class="mb-4 rounded-xl border border-green-200 bg-green-50 p-4 text-center text-sm font-medium text-green-700">
          {{ mensajeExito() }}
        </div>
      }

      <!-- MENSAJE DE ERROR -->
      @if (errorGeneral()) {
        <div class="mb-4 rounded-xl border border-red-200 bg-red-50 p-3 text-center text-xs font-medium text-red-600 sm:text-sm">
          {{ errorGeneral() }}
        </div>
      }

      <!-- FORMULARIO -->
      @if (!mensajeExito()) {
        <form (submit)="$event.preventDefault(); actualizarContrasena()" class="flex flex-col gap-4">

          <!-- NUEVA CONTRASEÑA -->
          <div class="flex flex-col gap-1">
            <label for="nuevaPassword" class="text-xs font-semibold text-gray-700 sm:text-sm">
              Nueva Contraseña
            </label>
            <div class="relative flex items-center">
              <span class="pointer-events-none absolute left-4 z-10 flex w-6 items-center justify-center opacity-90">
                <svg lucideLockKeyhole class="h-5 w-5 text-slate-400"></svg>
              </span>
              <input
                [type]="mostrarPassword() ? 'text' : 'password'"
                id="nuevaPassword"
                name="nuevaPassword"
                [ngModel]="nuevaPassword()"
                (ngModelChange)="nuevaPassword.set($event)"
                placeholder="••••••••"
                class="w-full rounded-xl border-2 border-gray-200 bg-[#f7f8fc] px-4 py-3 pl-14 pr-14 text-sm text-gray-800 outline-none transition duration-300 focus:border-[#2952e3] focus:ring-4 focus:ring-blue-600/10"
              />
              <button
                type="button"
                (click)="mostrarPassword.set(!mostrarPassword())"
                [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                class="absolute right-4 z-10 text-gray-400 hover:text-[#2952e3]"
              >
                @if (mostrarPassword()) {
                  <svg lucideEyeOff class="h-5 w-5"></svg>
                } @else {
                  <svg lucideEye class="h-5 w-5"></svg>
                }
              </button>
            </div>
          </div>

          <!-- CONFIRMAR CONTRASEÑA -->
          <div class="flex flex-col gap-1">
            <label for="confirmarPassword" class="text-xs font-semibold text-gray-700 sm:text-sm">
              Confirmar Contraseña
            </label>
            <div class="relative flex items-center">
              <span class="pointer-events-none absolute left-4 z-10 flex w-6 items-center justify-center opacity-90">
                <svg lucideLockKeyhole class="h-5 w-5 text-slate-400"></svg>
              </span>
              <input
                [type]="mostrarConfirmarPassword() ? 'text' : 'password'"
                id="confirmarPassword"
                name="confirmarPassword"
                [ngModel]="confirmarPassword()"
                (ngModelChange)="confirmarPassword.set($event)"
                placeholder="••••••••"
                class="w-full rounded-xl border-2 border-gray-200 bg-[#f7f8fc] px-4 py-3 pl-14 pr-14 text-sm text-gray-800 outline-none transition duration-300 focus:border-[#2952e3] focus:ring-4 focus:ring-blue-600/10"
              />
              <button
                type="button"
                (click)="mostrarConfirmarPassword.set(!mostrarConfirmarPassword())"
                [attr.aria-label]="mostrarConfirmarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                class="absolute right-4 z-10 text-gray-400 hover:text-[#2952e3]"
              >
                @if (mostrarConfirmarPassword()) {
                  <svg lucideEyeOff class="h-5 w-5"></svg>
                } @else {
                  <svg lucideEye class="h-5 w-5"></svg>
                }
              </button>
            </div>
          </div>

          <!-- BOTÓN SUBMIT -->
          <button
            type="submit"
            [disabled]="cargando() || !token()"
            class="btn-primary mt-2 w-full rounded-xl bg-[#1f3fbf] py-3 text-sm font-semibold text-white transition hover:bg-[#1732a8] disabled:opacity-60"
          >
            @if (cargando()) {
              Actualizando contraseña...
            } @else {
              Guardar nueva contraseña
            }
          </button>
        </form>
      }

      <!-- VOLVER AL LOGIN -->
      <div class="mt-5 text-center">
        <a routerLink="/login" class="text-xs text-[#2952e3] hover:underline sm:text-sm">
          ← Volver al Iniciar Sesión
        </a>
      </div>
    </main>
  </div>
</div>
