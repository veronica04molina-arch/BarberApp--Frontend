<section
  class="mt-4 flex items-start gap-3 rounded-[18px] border px-4 py-4"
  [class.border-emerald-200]="type() === 'success'"
  [class.bg-emerald-50]="type() === 'success'"
  [class.text-emerald-700]="type() === 'success'"
  [class.border-rose-200]="type() === 'error'"
  [class.bg-rose-50]="type() === 'error'"
  [class.text-rose-700]="type() === 'error'"
  [class.border-blue-200]="type() === 'info'"
  [class.bg-blue-50]="type() === 'info'"
  [class.text-blue-700]="type() === 'info'"
  [attr.role]="type() === 'error' ? 'alert' : 'status'"
>
  @if (type() === 'success') {
    <svg lucideCircleCheckBig class="mt-0.5 h-5 w-5 shrink-0" aria-hidden="true"></svg>
  } @else {
    <svg lucideCircleAlert class="mt-0.5 h-5 w-5 shrink-0" aria-hidden="true"></svg>
  }
  <p class="min-w-0 text-sm font-semibold leading-relaxed">{{ message() }}</p>
  @if (dismissible()) {
    <button
      type="button"
      (click)="close()"
      class="ml-auto flex h-8 w-8 shrink-0 items-center justify-center rounded-lg transition"
      [class.text-emerald-500]="type() === 'success'"
      [class.hover:bg-emerald-100]="type() === 'success'"
      [class.hover:text-emerald-700]="type() === 'success'"
      [class.text-rose-500]="type() === 'error'"
      [class.hover:bg-rose-100]="type() === 'error'"
      [class.hover:text-rose-700]="type() === 'error'"
      [class.text-blue-500]="type() === 'info'"
      [class.hover:bg-blue-100]="type() === 'info'"
      [class.hover:text-blue-700]="type() === 'info'"
      aria-label="Cerrar mensaje"
    >
      <svg lucideX class="h-4 w-4" aria-hidden="true"></svg>
    </button>
  }
</section>
